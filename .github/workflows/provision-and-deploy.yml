name: Provision and Deploy Bot

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: master

concurrency:
  group: provision-and-deploy-bot
  cancel-in-progress: false

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
      APP_PATH: ${{ vars.APP_PATH || '/opt/event-queue-bot' }}
      DO_REGION: ${{ vars.DO_REGION || 'nyc3' }}
      DO_SIZE: ${{ vars.DO_SIZE || 's-1vcpu-1gb' }}
      DO_IMAGE: ${{ vars.DO_IMAGE || 'ubuntu-24-04-x64' }}
      DO_DROPLET_NAME: ${{ vars.DO_DROPLET_NAME || 'event-queue-bot' }}
      DO_ENABLE_BACKUPS: ${{ vars.DO_ENABLE_BACKUPS || 'false' }}

    steps:
      - name: Validate required secrets
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          BOT_SSH_PRIVATE_KEY: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
          BOT_SSH_PUBLIC_KEY: ${{ secrets.BOT_SSH_PUBLIC_KEY }}
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          test -n "${DIGITALOCEAN_TOKEN}" || (echo "DIGITALOCEAN_TOKEN secret is required" >&2; exit 1)
          test -n "${BOT_SSH_PRIVATE_KEY}" || (echo "BOT_SSH_PRIVATE_KEY secret is required" >&2; exit 1)
          test -n "${BOT_SSH_PUBLIC_KEY}" || (echo "BOT_SSH_PUBLIC_KEY secret is required" >&2; exit 1)
          test -n "${BOT_APP_ID}" || (echo "BOT_APP_ID secret is required" >&2; exit 1)
          test -n "${BOT_TOKEN}" || (echo "BOT_TOKEN secret is required" >&2; exit 1)

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Validate provisioning script
        run: bash -n scripts/provision-digitalocean.sh

      - name: Provision DigitalOcean VPS
        id: provision
        env:
          BOT_SSH_PUBLIC_KEY: ${{ secrets.BOT_SSH_PUBLIC_KEY }}
        run: bash scripts/provision-digitalocean.sh

      - name: Configure SSH
        env:
          BOT_HOST: ${{ steps.provision.outputs.bot_host }}
          BOT_SSH_PRIVATE_KEY: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${BOT_SSH_PRIVATE_KEY}" > ~/.ssh/bot_deploy_key
          chmod 600 ~/.ssh/bot_deploy_key

          for attempt in {1..30}; do
            if ssh-keyscan -H "${BOT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi

            echo "Waiting for SSH host key..."
            sleep 10
          done

          echo "Timed out waiting for SSH host key" >&2
          exit 1

      - name: Wait for cloud-init
        env:
          BOT_HOST: ${{ steps.provision.outputs.bot_host }}
        run: |
          for attempt in {1..30}; do
            if ssh -i ~/.ssh/bot_deploy_key -o ConnectTimeout=10 deploy@"${BOT_HOST}" "sudo cloud-init status --wait && test -x /usr/local/bin/deploy-event-queue-bot"; then
              exit 0
            fi

            echo "Waiting for cloud-init..."
            sleep 10
          done

          echo "Timed out waiting for cloud-init" >&2
          exit 1

      - name: Build bot environment
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TOP_GG_TOKEN: ${{ secrets.TOP_GG_TOKEN }}
          PATCH_NOTES_CHANNEL_ID: ${{ secrets.PATCH_NOTES_CHANNEL_ID }}
          DEFAULT_COLOR: ${{ secrets.DEFAULT_COLOR }}
          DEFAULT_SCHEDULE_TIMEZONE: ${{ secrets.DEFAULT_SCHEDULE_TIMEZONE }}
          ENABLE_LEGACY_MIGRATION: ${{ secrets.ENABLE_LEGACY_MIGRATION }}
          FORCE_SEND_PATCH_NOTES: ${{ secrets.FORCE_SEND_PATCH_NOTES }}
        run: |
          umask 077
          {
            printf 'CLIENT_ID=%s\n' "${BOT_APP_ID}"
            printf 'TOKEN=%s\n' "${BOT_TOKEN}"
            printf 'TOP_GG_TOKEN=%s\n' "${TOP_GG_TOKEN}"
            printf 'PATCH_NOTES_CHANNEL_ID=%s\n' "${PATCH_NOTES_CHANNEL_ID}"
            printf 'DEFAULT_COLOR=%s\n' "${DEFAULT_COLOR:-Random}"
            printf 'DEFAULT_SCHEDULE_TIMEZONE=%s\n' "${DEFAULT_SCHEDULE_TIMEZONE:-america/chicago}"
            printf 'ENABLE_LEGACY_MIGRATION=%s\n' "${ENABLE_LEGACY_MIGRATION:-false}"
            printf 'FORCE_SEND_PATCH_NOTES=%s\n' "${FORCE_SEND_PATCH_NOTES:-false}"
          } > "${RUNNER_TEMP}/bot.env"

      - name: Sync repository to VPS
        env:
          BOT_HOST: ${{ steps.provision.outputs.bot_host }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'data/main.sqlite' \
            --exclude 'data/backups' \
            --exclude 'data/migrations/legacy-export' \
            --exclude 'logs' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/bot_deploy_key" \
            ./ deploy@"${BOT_HOST}":"${APP_PATH}/"

      - name: Write bot environment
        env:
          BOT_HOST: ${{ steps.provision.outputs.bot_host }}
        run: |
          ssh -i ~/.ssh/bot_deploy_key deploy@"${BOT_HOST}" "umask 077 && cat > '${APP_PATH}/.env.tmp' && mv '${APP_PATH}/.env.tmp' '${APP_PATH}/.env'" < "${RUNNER_TEMP}/bot.env"

      - name: Deploy bot
        env:
          BOT_HOST: ${{ steps.provision.outputs.bot_host }}
        run: |
          ssh -i ~/.ssh/bot_deploy_key deploy@"${BOT_HOST}" "sudo /usr/local/bin/deploy-event-queue-bot"

      - name: Prune unused Docker images
        env:
          BOT_HOST: ${{ steps.provision.outputs.bot_host }}
        run: |
          ssh -i ~/.ssh/bot_deploy_key deploy@"${BOT_HOST}" "docker image prune -f"

      - name: Show recent bot logs
        env:
          BOT_HOST: ${{ steps.provision.outputs.bot_host }}
        run: |
          ssh -i ~/.ssh/bot_deploy_key deploy@"${BOT_HOST}" "docker logs --tail 100 queue-bot"
