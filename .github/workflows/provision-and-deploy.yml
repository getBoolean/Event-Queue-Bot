name: Provision and Deploy Bot

on:
  push:
  workflow_dispatch:

concurrency:
  group: provision-and-deploy-bot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=critical

  gate:
    needs: ci
    if: github.ref_name == 'master' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod-gate' || 'dev-gate' }}
    permissions:
      contents: read
    steps:
      - name: Await reviewer approval
        run: echo "Approved for ${{ github.ref_name }}."

  build-and-push:
    needs: gate
    if: github.ref_name == 'master' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  discover:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DO_DROPLET_NAME: ${{ vars.DO_DROPLET_NAME || 'event-queue-bot' }}

    outputs:
      droplet_exists: ${{ steps.lookup.outputs.droplet_exists }}
      bot_host: ${{ steps.lookup.outputs.bot_host }}
      droplet_id: ${{ steps.lookup.outputs.droplet_id }}

    steps:
      - name: Validate DigitalOcean token
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: test -n "${DIGITALOCEAN_TOKEN}" || (echo "DIGITALOCEAN_TOKEN secret is required" >&2; exit 1)

      - name: Install doctl
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          version: 1.159.0

      - name: Look up existing droplet
        id: lookup
        run: |
          set -euo pipefail
          row=$(doctl compute droplet list \
            --format Name,Status,PublicIPv4,ID \
            --no-header \
            | awk -v name="${DO_DROPLET_NAME}" '$1 == name && $2 == "active" && $3 != "" { print $3, $4; exit }')
          if [ -n "${row}" ]; then
            ip=$(echo "${row}" | awk '{print $1}')
            id=$(echo "${row}" | awk '{print $2}')
            {
              echo "droplet_exists=true"
              echo "bot_host=${ip}"
              echo "droplet_id=${id}"
            } >> "${GITHUB_OUTPUT}"
            echo "Found active droplet ${id} at ${ip} — provision will be skipped."
          else
            {
              echo "droplet_exists=false"
              echo "bot_host="
              echo "droplet_id="
            } >> "${GITHUB_OUTPUT}"
            echo "No active droplet named '${DO_DROPLET_NAME}' found — provision will run."
          fi

  # Tradeoff: skipping provision also skips the firewall, SSH-key registration, and
  # DigitalOcean project membership reconciliation in scripts/provision-digitalocean.sh
  # — those run only when this job runs. If you edit those sections of the script,
  # the next push will not apply them to a living droplet. To force re-provision:
  # delete the droplet via the DO console or `doctl compute droplet delete`, then
  # re-run this workflow.
  provision:
    needs: discover
    if: needs.discover.outputs.droplet_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DO_REGION: ${{ vars.DO_REGION || 'nyc3' }}
      DO_SIZE: ${{ vars.DO_SIZE || 's-1vcpu-1gb' }}
      DO_IMAGE: ${{ vars.DO_IMAGE || 'ubuntu-24-04-x64' }}
      DO_DROPLET_NAME: ${{ vars.DO_DROPLET_NAME || 'event-queue-bot' }}
      DO_ENABLE_BACKUPS: ${{ vars.DO_ENABLE_BACKUPS || 'false' }}
      DO_SWAP_SIZE: ${{ vars.DO_SWAP_SIZE || '1G' }}
      DO_PROJECT_NAME: ${{ vars.DO_PROJECT_NAME || 'Event Queue Bot' }}
      DO_PROJECT_PURPOSE: ${{ vars.DO_PROJECT_PURPOSE || 'Service or API' }}
      DO_PROJECT_ENVIRONMENT: ${{ vars.DO_PROJECT_ENVIRONMENT || 'Production' }}
      DO_PROJECT_DESCRIPTION: ${{ vars.DO_PROJECT_DESCRIPTION }}

    outputs:
      bot_host: ${{ steps.provision.outputs.bot_host }}
      droplet_id: ${{ steps.provision.outputs.droplet_id }}

    steps:
      - name: Validate required secrets
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          SSH_DEPLOY_PUBLIC_KEY: ${{ secrets.SSH_DEPLOY_PUBLIC_KEY }}
          SSH_HOST_PRIVATE_KEY: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          SSH_HOST_PUBLIC_KEY: ${{ secrets.SSH_HOST_PUBLIC_KEY }}
        run: |
          test -n "${DIGITALOCEAN_TOKEN}" || (echo "DIGITALOCEAN_TOKEN secret is required" >&2; exit 1)
          test -n "${SSH_DEPLOY_PUBLIC_KEY}" || (echo "SSH_DEPLOY_PUBLIC_KEY secret is required" >&2; exit 1)
          test -n "${SSH_HOST_PRIVATE_KEY}" || (echo "SSH_HOST_PRIVATE_KEY secret is required" >&2; exit 1)
          test -n "${SSH_HOST_PUBLIC_KEY}" || (echo "SSH_HOST_PUBLIC_KEY secret is required" >&2; exit 1)

      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          version: 1.159.0

      - name: Validate provisioning script
        run: bash -n scripts/provision-digitalocean.sh

      - name: Provision DigitalOcean VPS
        id: provision
        env:
          SSH_DEPLOY_PUBLIC_KEY: ${{ secrets.SSH_DEPLOY_PUBLIC_KEY }}
          SSH_HOST_PRIVATE_KEY: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          SSH_HOST_PUBLIC_KEY: ${{ secrets.SSH_HOST_PUBLIC_KEY }}
        run: bash scripts/provision-digitalocean.sh

  deploy:
    needs: [discover, provision]
    if: |
      always()
      && needs.discover.result == 'success'
      && (needs.provision.result == 'success' || needs.provision.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    concurrency:
      group: provision-and-deploy-bot-droplet
      cancel-in-progress: false
    permissions:
      contents: read

    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      APP_PATH: ${{ vars.APP_PATH || (github.ref_name == 'prod' && '/opt/event-queue-bot' || '/opt/event-queue-bot-nightly') }}
      CONTAINER_NAME: ${{ github.ref_name == 'prod' && 'queue-bot' || 'queue-bot-nightly' }}
      IMAGE_TAG: ${{ github.ref_name }}
      # Coalesce: fresh-provision output wins; otherwise discover's lookup.
      BOT_HOST: ${{ needs.provision.outputs.bot_host || needs.discover.outputs.bot_host }}

    steps:
      - name: Validate required secrets
        env:
          SSH_DEPLOY_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          SSH_HOST_PUBLIC_KEY: ${{ secrets.SSH_HOST_PUBLIC_KEY }}
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          test -n "${SSH_DEPLOY_PRIVATE_KEY}" || (echo "SSH_DEPLOY_PRIVATE_KEY secret is required" >&2; exit 1)
          test -n "${SSH_HOST_PUBLIC_KEY}" || (echo "SSH_HOST_PUBLIC_KEY secret is required" >&2; exit 1)
          test -n "${BOT_APP_ID}" || (echo "BOT_APP_ID secret is required" >&2; exit 1)
          test -n "${BOT_TOKEN}" || (echo "BOT_TOKEN secret is required" >&2; exit 1)

      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          version: 1.159.0

      - name: Ensure firewall allows bot ports
        env:
          DO_DROPLET_NAME: ${{ vars.DO_DROPLET_NAME || 'event-queue-bot' }}
        run: bash scripts/ensure-firewall.sh

      - name: Configure SSH
        env:
          SSH_DEPLOY_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          SSH_HOST_PUBLIC_KEY: ${{ secrets.SSH_HOST_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_DEPLOY_PRIVATE_KEY}" > ~/.ssh/bot_deploy_key
          chmod 600 ~/.ssh/bot_deploy_key

          printf '%s %s\n' "${BOT_HOST}" "${SSH_HOST_PUBLIC_KEY}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          for attempt in {1..30}; do
            if ssh_output=$(ssh -i ~/.ssh/bot_deploy_key -o BatchMode=yes -o ConnectTimeout=5 deploy@"${BOT_HOST}" true 2>&1); then
              exit 0
            fi
            echo "Waiting for SSH (attempt ${attempt}/30): ${ssh_output}"
            sleep 10
          done

          echo "Timed out waiting for SSH connectivity" >&2
          exit 1

      - name: Wait for cloud-init
        run: |
          for attempt in {1..30}; do
            if ssh -i ~/.ssh/bot_deploy_key -o ConnectTimeout=10 deploy@"${BOT_HOST}" \
              "cloud-init status --wait && test -x /usr/local/bin/deploy-event-queue-bot"; then
              exit 0
            fi

            echo "Waiting for cloud-init..."
            sleep 10
          done

          echo "Timed out waiting for cloud-init" >&2
          exit 1

      - name: Build bot environment
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOP_GG_TOKEN: ${{ vars.BOT_TOP_GG_TOKEN }}
          BOT_PATCH_NOTES_CHANNEL_ID: ${{ vars.BOT_PATCH_NOTES_CHANNEL_ID }}
          BOT_DEFAULT_COLOR: ${{ vars.BOT_DEFAULT_COLOR }}
          BOT_DEFAULT_SCHEDULE_TIMEZONE: ${{ vars.BOT_DEFAULT_SCHEDULE_TIMEZONE }}
          BOT_ENABLE_LEGACY_MIGRATION: ${{ vars.BOT_ENABLE_LEGACY_MIGRATION }}
          BOT_FORCE_SEND_PATCH_NOTES: ${{ vars.BOT_FORCE_SEND_PATCH_NOTES }}
          BOT_SILENT: ${{ vars.BOT_SILENT }}
        run: |
          umask 077
          {
            printf 'CLIENT_ID=%s\n' "${BOT_APP_ID}"
            printf 'TOKEN=%s\n' "${BOT_TOKEN}"
            printf 'TOP_GG_TOKEN=%s\n' "${BOT_TOP_GG_TOKEN}"
            printf 'PATCH_NOTES_CHANNEL_ID=%s\n' "${BOT_PATCH_NOTES_CHANNEL_ID}"
            printf 'DEFAULT_COLOR=%s\n' "${BOT_DEFAULT_COLOR:-Random}"
            printf 'DEFAULT_SCHEDULE_TIMEZONE=%s\n' "${BOT_DEFAULT_SCHEDULE_TIMEZONE:-america/chicago}"
            printf 'ENABLE_LEGACY_MIGRATION=%s\n' "${BOT_ENABLE_LEGACY_MIGRATION:-false}"
            printf 'FORCE_SEND_PATCH_NOTES=%s\n' "${BOT_FORCE_SEND_PATCH_NOTES:-false}"
            printf 'SILENT=%s\n' "${BOT_SILENT:-false}"
            printf 'CONTAINER_NAME=%s\n' "${CONTAINER_NAME}"
            printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}"
          } > "${RUNNER_TEMP}/bot.env"

      - name: Sync deploy artifacts to VPS
        run: |
          ssh -i ~/.ssh/bot_deploy_key deploy@"${BOT_HOST}" "mkdir -p '${APP_PATH}'"
          rsync -az \
            -e "ssh -i ~/.ssh/bot_deploy_key" \
            docker-compose.app.yml deploy@"${BOT_HOST}":"${APP_PATH}/"

      - name: Write bot environment
        run: |
          ssh -i ~/.ssh/bot_deploy_key deploy@"${BOT_HOST}" "umask 077 && cat > '${APP_PATH}/.env.tmp' && mv '${APP_PATH}/.env.tmp' '${APP_PATH}/.env'" < "${RUNNER_TEMP}/bot.env"

      - name: Log in to GHCR on VPS
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -n "${GHCR_PULL_TOKEN}" ]; then
            ssh -i ~/.ssh/bot_deploy_key deploy@"${BOT_HOST}" \
              "echo '${GHCR_PULL_TOKEN}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          fi

      - name: Deploy bot
        run: |
          ssh -i ~/.ssh/bot_deploy_key deploy@"${BOT_HOST}" "sudo /usr/local/bin/deploy-event-queue-bot '${APP_PATH}'"
