#cloud-config
package_update: true
package_upgrade: false
disable_root: true
ssh_pwauth: false
ssh_deletekeys: false

swap:
  filename: /swapfile
  size: {{DO_SWAP_SIZE}}
  maxsize: {{DO_SWAP_SIZE}}

groups:
  - docker

users:
  - default
  - name: deploy
    gecos: Queue Bot Deploy User
    shell: /bin/bash
    lock_passwd: true
    groups:
      - docker
    ssh_authorized_keys:
      - {{SSH_PUBLIC_KEY_YAML}}

write_files:
  - path: /usr/local/bin/deploy-event-queue-bot
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if [ "$#" -ne 1 ]; then
        echo "Usage: deploy-event-queue-bot <app-path>" >&2
        exit 1
      fi

      APP_DIR="$1"

      mkdir -p "$APP_DIR/data"
      chown -R deploy:deploy "$APP_DIR"

      cd "$APP_DIR"

      if [ ! -f docker-compose.app.yml ]; then
        echo "Missing $APP_DIR/docker-compose.app.yml; sync deploy artifacts before deploying." >&2
        exit 1
      fi

      if [ ! -s .env ]; then
        echo "Missing $APP_DIR/.env; refusing to start the bot." >&2
        exit 1
      fi

      # shellcheck disable=SC1091
      set -a
      source .env
      set +a

      if [ -z "${CONTAINER_NAME:-}" ]; then
        echo "CONTAINER_NAME is required in $APP_DIR/.env" >&2
        exit 1
      fi

      docker compose -f docker-compose.app.yml pull
      docker compose -f docker-compose.app.yml up -d
      docker image prune -f --filter "until=72h"

      for attempt in {1..12}; do
        if docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null | grep -qx true; then
          break
        fi
        if [ "$attempt" -eq 12 ]; then
          echo "Bot container did not start after deploy" >&2
          docker ps -a --filter "name=$CONTAINER_NAME" || true
          docker logs --tail 200 "$CONTAINER_NAME" 2>&1 || true
          exit 1
        fi
        sleep 2
      done

      docker logs --tail 100 "$CONTAINER_NAME"

  - path: /etc/sudoers.d/event-queue-bot-deploy
    owner: root:root
    permissions: "0440"
    content: |
      deploy ALL=(root) NOPASSWD: /usr/local/bin/deploy-event-queue-bot

  - path: /etc/ssh/ssh_host_ed25519_key
    owner: root:root
    permissions: "0600"
    encoding: b64
    content: {{SSH_HOST_PRIVATE_KEY_B64}}

  - path: /etc/ssh/ssh_host_ed25519_key.pub
    owner: root:root
    permissions: "0644"
    content: {{SSH_HOST_PUBLIC_KEY}}

runcmd:
  - systemctl restart ssh
  - apt-get update
  - apt-get install -y ca-certificates curl git gnupg rsync
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - mkdir -p /opt/event-queue-bot/data /opt/event-queue-bot-nightly/data
  - chown -R deploy:deploy /opt/event-queue-bot /opt/event-queue-bot-nightly
