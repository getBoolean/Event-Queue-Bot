#cloud-config
package_update: true
package_upgrade: false
disable_root: true
ssh_pwauth: false
ssh_deletekeys: false

swap:
  filename: /swapfile
  size: {{DO_SWAP_SIZE}}
  maxsize: {{DO_SWAP_SIZE}}

groups:
  - docker

users:
  - default
  - name: deploy
    gecos: Queue Bot Deploy User
    shell: /bin/bash
    lock_passwd: true
    groups:
      - docker
    ssh_authorized_keys:
      - {{SSH_PUBLIC_KEY_YAML}}

write_files:
  # Thin root wrappers. They exec the repo-synced scripts under
  # /opt/event-queue-bot-bin so the prepare/deploy logic can be updated on every
  # deploy without re-provisioning. The deploy user is already in the docker
  # group (root-equivalent), so running the deploy-owned scripts as root via
  # sudo adds no extra privilege. Only these wrappers, the sudoers entry, and
  # the cloud-init runcmd require a re-provision to change.
  - path: /usr/local/bin/prepare-event-queue-bot-dir
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      SCRIPT=/opt/event-queue-bot-bin/prepare-event-queue-bot-dir.sh
      if [ ! -x "$SCRIPT" ]; then
        echo "Missing $SCRIPT; the deploy workflow syncs it before use." >&2
        exit 1
      fi
      exec "$SCRIPT" "$@"

  - path: /usr/local/bin/deploy-event-queue-bot
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      SCRIPT=/opt/event-queue-bot-bin/deploy-event-queue-bot.sh
      if [ ! -x "$SCRIPT" ]; then
        echo "Missing $SCRIPT; the deploy workflow syncs it before use." >&2
        exit 1
      fi
      exec "$SCRIPT" "$@"

  - path: /etc/sudoers.d/event-queue-bot-deploy
    owner: root:root
    permissions: "0440"
    content: |
      deploy ALL=(root) NOPASSWD: /usr/local/bin/deploy-event-queue-bot
      deploy ALL=(root) NOPASSWD: /usr/local/bin/prepare-event-queue-bot-dir

  - path: /etc/ssh/ssh_host_ed25519_key
    owner: root:root
    permissions: "0600"
    encoding: b64
    content: {{SSH_HOST_PRIVATE_KEY_B64}}

  - path: /etc/ssh/ssh_host_ed25519_key.pub
    owner: root:root
    permissions: "0644"
    content: {{SSH_HOST_PUBLIC_KEY}}

runcmd:
  - systemctl restart ssh
  - apt-get update
  - apt-get install -y ca-certificates curl git gnupg rsync
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - mkdir -p /opt/event-queue-bot-bin /opt/event-queue-bot/data /opt/event-queue-bot/logs /opt/event-queue-bot-nightly/data /opt/event-queue-bot-nightly/logs
  - chown -R deploy:deploy /opt/event-queue-bot-bin /opt/event-queue-bot /opt/event-queue-bot-nightly
